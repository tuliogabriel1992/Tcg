function go(v){view=v;render()}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(b.hasAttribute('data-matchup')){let field=document.getElementById('opponentInput');if(field){field.value=b.dataset.matchup==='Outro'?'':b.dataset.matchup;document.querySelectorAll('[data-matchup]').forEach(x=>{let selected=x===b;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',String(selected))});field.focus()}return}if(['home','trainings','tournaments','community','profile','new-tournament','decks','analysis'].includes(a))return go(a);if(a==='new-deck'){editingDeck=null;return go('deck-editor')}if(a==='edit-deck'){editingDeck=b.dataset.deck;return go('deck-editor')}if(a==='make-main'){if(data.decks.includes(b.dataset.deck)){data.mainDeck=b.dataset.deck;save();render()}return}if(a==='new-game'){formMode='single';return go('game')}if(a==='new-session'){let s={id:id(),created:new Date().toISOString(),finished:false};data.sessions.push(s);currentId=s.id;save();return go('training')}if(a==='open-training'){currentId=b.dataset.id;return go('training')}if(a==='training-game'){formMode='training';return go('game')}if(a==='finish-training'){let s=data.sessions.find(s=>s.id===currentId);if(s)s.finished=true;save();return go('trainings')}if(a==='back')return go(formMode==='training'?'training':'home');if(a==='open-tournament'){currentId=b.dataset.id;return go('tournament')}if(a==='open-current-tournament')return go('tournament');if(a==='new-round')return go('round');if(a==='finish-tournament'){if(!confirm('Finalizar este torneio?'))return;data.tournaments.find(t=>t.id===currentId).finished=true;save();return go('tournament')}if(a==='export-csv'){let rows=[['Origem','Data','Seu deck','Deck adversário','Resultado','Pontos']];data.games.forEach(g=>rows.push([g.sessionId?'Treino':'Avulsa',g.date||'',g.deck,g.opponent||'',g.result,score(g.result)]));data.tournaments.forEach(t=>t.rounds.forEach(r=>rows.push(['Torneio: '+t.name,t.date||'',t.deck,r.opponent||'',r.result,score(r.result)])));let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='tcg-companion-estatisticas.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='tcg-companion-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});function bindForms(){const form=(id,fn)=>{let f=document.getElementById(id);if(f)f.addEventListener('submit',e=>{e.preventDefault();fn(Object.fromEntries(new FormData(f)))})};form('gameForm',f=>{data.games.push({id:id(),date:new Date().toISOString(),deck:f.deck,result:f.result,opponent:f.opponent,name:f.name,sessionId:formMode==='training'?currentId:null});save();go(formMode==='training'?'training':'home')});form('tournamentForm',f=>{let t={id:id(),name:f.name,city:f.city,date:f.date,format:f.format,deck:f.deck,plannedRounds:Number(f.plannedRounds)||0,rounds:[],finished:false};data.tournaments.push(t);currentId=t.id;save();go('tournament')});form('roundTimerForm',f=>{const t=data.tournaments.find(x=>x.id===currentId),n=Number(f.minutes);if(!t||t.finished||!Number.isInteger(n)||n<1||n>120)return;t.timerMinutes=n;t.timerEnd=Date.now()+n*60000;save();go('tournament')});form('roundPlanForm',f=>{let t=data.tournaments.find(x=>x.id===currentId);let n=Number(f.plannedRounds);if(!t||t.finished||!Number.isInteger(n)||n<Math.max(1,t.rounds.length)||n>Math.max(30,t.rounds.length))return;t.plannedRounds=n;save();go('tournament')});form('roundForm',f=>{const t=data.tournaments.find(t=>t.id===currentId);if(!t||t.finished)return;t.rounds.push({result:f.result,opponent:f.opponent,table:f.table,name:f.name});t.timerEnd=0;save();go('tournament')});form('competitiveGoalsForm',f=>{const w=Number(f.winGoal),e=Number(f.eventGoal);if(!Number.isInteger(w)||w<1||w>100000||!Number.isInteger(e)||e<1||e>10000)return;data.profile.winGoal=w;data.profile.eventGoal=e;save();go('profile')});form('profileForm',f=>{data.profile={...data.profile,name:f.name,playerId:f.playerId};data.mainDeck=f.mainDeck;save();go('profile')});form('deckEditorForm',f=>{let d=f.deck.trim();if(!d)return;if(!data.decks.includes(d))data.decks.push(d);data.deckMeta[d]={p1:f.p1,p2:f.p2};if(!data.mainDeck)data.mainDeck=d;save();go('decks')});form('deckForm',f=>{let d=f.deck.trim();if(d&&!data.decks.includes(d))data.decks.push(d);save();go('profile')});let imp=document.getElementById('importFile');if(imp)imp.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!d.profile||!Array.isArray(d.games)||!Array.isArray(d.sessions)||!Array.isArray(d.tournaments)||!Array.isArray(d.decks))throw Error();if(confirm('Substituir os dados locais pelos do backup?')){data=d;data.deckMeta=data.deckMeta||{};save();go('home')}}catch{alert('Arquivo de backup inválido.')}})}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

};
</script>

{id:'celadon',name:'Celadon City',sub:'Jardins e flores',primary:'#d28eab',secondary:'#f9e1eb',bg:'#fff7fa',text:'#8e4c6a',hero:'#eab7c9',hero2:'#b7a0db'},

function apply(id){const t=themes.find(x=>x.id===id)||themes[2];Object.entries({primary:t.primary,secondary:t.secondary,bg:t.bg,text:t.text,hero:t.hero,hero2:t.hero2}).forEach(([k,v])=>root.style.setProperty('--city-'+k,v));localStorage.setItem(key,t.id);button.textContent='🎨 '+t.name;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t.primary);return t}

<script id="journey-engine">
(function(){
const milestones=[
{city:'Pewter',name:'Insígnia da Rocha',symbol:'🪨',need:1,leader:'Brock'},
{city:'Cerulean',name:'Insígnia da Cascata',symbol:'💧',need:3,leader:'Misty'},
{city:'Vermilion',name:'Insígnia do Trovão',symbol:'⚡',need:5,leader:'Lt. Surge'},
{city:'Celadon',name:'Insígnia do Arco-Íris',symbol:'🌈',need:8,leader:'Erika'},
{city:'Fuchsia',name:'Insígnia da Alma',symbol:'☯️',need:12,leader:'Koga'},
{city:'Saffron',name:'Insígnia do Pântano',symbol:'🔮',need:16,leader:'Sabrina'},
{city:'Cinnabar',name:'Insígnia do Vulcão',symbol:'🔥',need:22,leader:'Blaine'},
{city:'Viridian',name:'Insígnia da Terra',symbol:'🌿',need:30,leader:'Giovanni'}
];
function record(){try{let d=JSON.parse(localStorage.getItem('tcg-companion-v1')||'null');return d}catch(e){return null}}
function findData(){const known=record();if(known)return known;for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&/tcg/i.test(k)&&!/city|journey/i.test(k)){try{let d=JSON.parse(localStorage.getItem(k));if(d&&Array.isArray(d.games)&&Array.isArray(d.tournaments))return d}catch(e){}}}return null}
function wins(){const d=findData();if(!d)return 0;return (d.games||[]).filter(x=>x.result==='Vitória').length+(d.tournaments||[]).reduce((n,t)=>n+(t.rounds||[]).filter(r=>r.result==='Vitória').length,0)}
const button=document.createElement('button');button.id='journey-open';button.type='button';button.textContent='🏅 Jornada';
const overlay=document.createElement('div');overlay.id='journey-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Jornada de insígnias');
document.body.append(button,overlay);
const spots=[{name:'Pewter',x:23,y:23},{name:'Cerulean',x:58,y:24},{name:'Vermilion',x:67,y:57},{name:'Celadon',x:39,y:42},{name:'Fuchsia',x:39,y:75},{name:'Saffron',x:61,y:43},{name:'Cinnabar',x:21,y:83},{name:'Viridian',x:18,y:52}];
function mapMarkup(n){const line=spots.map(p=>p.x+','+p.y).join(' ');return '<div class="kanto-map" aria-label="Mapa estilizado da jornada por Kanto"><div class="kanto-land"></div><svg class="kanto-path" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="'+line+'"/></svg>'+spots.map((p,i)=>'<button type="button" class="kanto-stop '+(n>=milestones[i].need?'done':'')+'" data-map-stop="'+i+'" style="left:'+p.x+'%;top:'+p.y+'%">'+milestones[i].symbol+' '+p.name+'</button>').join('')+'<span class="kanto-map-label">Mapa ilustrativo · não geográfico</span></div><div class="kanto-detail" id="kanto-map-detail">Selecione uma cidade para ver seu desafio.</div>'}
function show(){const n=wins(),unlocked=milestones.filter(m=>n>=m.need).length;overlay.innerHTML='<div class="journey-panel"><h2>Minha jornada por Kanto</h2><p>Conquiste insígnias registrando vitórias reais em partidas, treinos ou torneios. O progresso usa seu histórico local.</p><b>'+unlocked+' de 8 insígnias conquistadas</b><div class="journey-progress"><i style="width:'+(unlocked/8*100)+'%"></i></div><p>'+n+' vitórias registradas</p><div class="journey-grid">'+milestones.map(m=>'<div class="journey-badge '+(n>=m.need?'unlocked':'')+'"><div class="symbol">'+m.symbol+'</div><b>'+m.name+'</b><small>'+m.city+' · '+m.leader+'</small><div class="count">'+(n>=m.need?'✓ Conquistada':n+' / '+m.need+' vitórias')+'</div></div>').join('')+'</div><h3>Mapa da jornada</h3>'+mapMarkup(n)+'<p>Desafios temáticos do TCG Companion, não insígnias oficiais de torneios Pokémon.</p><button class="journey-close" type="button">Fechar</button></div>';overlay.classList.add('open');overlay.querySelector('.journey-close').onclick=close;overlay.querySelectorAll('[data-map-stop]').forEach(b=>b.onclick=()=>{const m=milestones[Number(b.dataset.mapStop)];overlay.querySelector('#kanto-map-detail').textContent=m.city+' · '+m.leader+' — '+m.name+' — '+(n>=m.need?'Conquistada!':'Desbloqueia com '+m.need+' vitórias ('+n+' registradas).')})}
function close(){overlay.classList.remove('open')}
button.onclick=show;overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(console.warn))}</script><script src="/community.js" defer></script></body></html>
